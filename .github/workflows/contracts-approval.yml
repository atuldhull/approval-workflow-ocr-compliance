# CODEOWNERS accepts approval from any ONE listed owner. Changes to contracts/ need the whole team:
# both teammates other than the author (all three if the author is outside the team), each approving
# the CURRENT head commit. The decision logic is .github/scripts/contract-approval.js.
#
# Security:
# - Never checks out or runs pull-request code. Only the decision script is checked out, from the BASE branch.
# - Token is read-only (contents + pull-requests).
# - pull_request_target uses this file as it exists on the base branch, so a pull request cannot weaken
#   the rule for itself on that trigger. Review events run the pull request's copy of this file; see
#   docs/CONTRACT_APPROVAL.md for the remaining risk and the branch-protection settings that go with it.
name: contracts-approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contracts-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  all-three-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the decision script from the base branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Evaluate designated approvals
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contract-approval.js`);
            const base = { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number };
            // Re-read the pull request: the event payload can be older than the current head.
            const { data: pr } = await github.rest.pulls.get(base);
            const files = await github.paginate(github.rest.pulls.listFiles, { ...base, per_page: 100 });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...base, per_page: 100 });
            const result = evaluate({
              author: pr.user.login, headSha: pr.head.sha, files, changedFiles: pr.changed_files, reviews,
            });
            if (result.files.length) core.info(`Protected files: ${result.files.join(", ")}`);
            await core.summary.addHeading("Contract approval").addRaw(result.message).write();
            if (result.ok) core.info(result.message);
            else core.setFailed(result.message);
