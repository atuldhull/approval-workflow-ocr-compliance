# Authority for the contract-approval rule (see docs/CONTRACT_APPROVAL.md).
#
# Changes to contracts/ (and to workflows, scripts and CODEOWNERS) need both teammates other than the author
# - all three if the author is outside the team - each approving the CURRENT head commit.
# The result is posted as the commit status "contracts-approval/designated-approvals" on the PR head; that is
# the status branch protection must require.
#
# Why these triggers: GitHub runs pull_request_target and workflow_run with the workflow file from the DEFAULT
# branch, so a pull request cannot change this file or the script for the run that judges it. Reviews arrive
# via contracts-approval-review-signal.yml (pull_request_review), which runs the PR's own copy and is therefore
# trusted for nothing - it only wakes this workflow up.
#
# Security:
# - Never checks out or runs pull-request code; only .github/scripts from the default branch.
# - Token: read-only except statuses: write, which is needed to attach the result to the PR head commit.
name: contracts-approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [contracts-approval-review-signal]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: contracts-approval-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  all-three-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the decision script from the default branch only
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Evaluate designated approvals and post the commit status
        uses: actions/github-script@v7
        with:
          script: |
            const { main } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contract-approval.js`);
            const ok = await main({ github, context, core });
            if (!ok) core.setFailed("Designated approvals are missing; see the commit status on the pull request.");
