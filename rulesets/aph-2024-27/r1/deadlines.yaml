# Deadline rules for aph-2024-27@r1.
# source.status: verified | verified_letter_text | demo_assumption (no handbook figure found; configurable)
rules:
  # DEMO ASSUMPTION: no APH-confirmed EVC duration; configurable demonstration value.
  - id: EVC_PROCESSING
    clock_kind: INTERNAL
    clock_owner: COMMITTEE
    source: {status: demo_assumption}
    anchor: evc.request_created
    duration: {value: 7, unit: calendar_days}

  - id: AICTE_PROCESSING
    clock_kind: INTERNAL
    clock_owner: AICTE
    source: {status: demo_assumption}
    anchor: application.submitted
    duration: {value: 30, unit: calendar_days}

  - id: INSTITUTION_RESPONSE
    clock_kind: INTERNAL
    clock_owner: INSTITUTION
    source: {status: demo_assumption}
    anchor: deficiency.recorded
    duration: {value: 15, unit: calendar_days}

  - id: APPEAL_7D
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "2.24(a)", status: verified}
    anchor: decision.uploaded
    # calendar vs working days is not confirmed; configurable
    duration: {value: 7, unit: calendar_days}
    on_expiry: close_appeal_window
    # not appealing is the institution's choice, not a breach: remind only, never escalate
    alert_ladder: reminder_only

  # APH 2024-27 cl. 2.25(f), p.47: security deposit and Affidavit 3 within 15 days of the intimation. Opened for
  # the DEPOSIT and AFFIDAVIT obligations of a registered LoA, whose issue date is the intimation.
  - id: DEPOSIT_15D
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "2.25(f)", page: 47, status: verified}
    anchor: letter.issue_date
    duration: {value: 15, unit: calendar_days}
    # demo assumption: one reminder to the institution per offset before the due date
    reminders: [-7d, -2d, -1d]
    # (the escalation list below is not read; after the due date the timer worker uses alerts.ladders)
    escalation: [{after: 0d, to: RO_OFFICER}, {after: 5d, to: BUREAU_HEAD}]
    # cl. 2.25(f): a late deposit carries a 10 % penalty up to 31 May and 20 % up to 31 July, beyond which the
    # approval is withdrawn. Shown to officers as notes for the competent authority; the system never applies them.
    penalty_tiers: [{until: "05-31", pct: 10}, {until: "07-31", pct: 20}]
    beyond_last_tier: approval_withdrawn

  - id: EOA_DEFICIENCY_6M
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {doc: "EoA letters that list deficiencies", status: verified_letter_text}
    # never attached to an EoA directly; all conditions must hold
    applies_to: obligation
    applies_when:
      - obligation.kind == LETTER_CONDITION
      - obligation.source_letter.lists_deficiencies == true
      - obligation.state_origin == OFFICER_CONFIRMED
    anchor: obligation.source_letter.issue_date
    # 31 Aug + 6 months -> 28/29 Feb
    duration: {value: 6, unit: months, month_end: clamp}
    reminders: [-60d, -30d, -7d]

  # APH cl. 2.1(e), p.28: no EoA from the academic year in which the live lease equals the longest course
  # duration, unless the lease is extended by a further 30 years. Computed for every lease validity record.
  - id: LEASE_EOA_STOP
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "2.1(e)", page: 28, status: verified}
    computed: lease_eoa_stop_year
    inputs: [lease_end_date, max_course_duration_years, ay_start_rule]
    # ay_start_rule comes from academic_year.starts below
    # relative to the start of the stop academic year; demo assumption
    reminders: [-18mo, -12mo, -6mo]
    # demo assumption: the case does not record its programmes' durations, so the longest course is taken as
    # four years unless the officer recording the lease states it
    max_course_duration_years: 4
    # cl. 6.17(a), p.72: a lease of at least 30 years, and a live lease at least as long as the longest course at
    # the time of submission
    lease_minimum_years: 30

  # ---- document validity (APH cl. 6.17) ----
  # A document whose validity a confirmed fact (or an officer) records - land lease deed (6.17(a)), occupancy or
  # completion certificate (6.17(g)), structural stability certificate (6.17(h)), fire safety certificate
  # (6.17(i)) - opens a DOCUMENT_VALIDITY obligation that falls due on its expiry date. The expiry date is read
  # from the document itself; the APH sets the period only for the structural stability certificate.
  - id: DOCUMENT_EXPIRY
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "6.17", page: 72, status: verified}
    anchor: document.valid_until
    due: on_anchor_date
    # demo assumption: advance reminders to the institution; the document_expiry ladder takes over at expiry
    reminders: [-90d, -30d, -7d]
    alert_ladder: document_expiry

  # APH cl. 6.17(h), p.73: the structural stability certificate is valid for five years from its issue. Used to
  # work out the expiry when only the issue date is known; never opened as a clock of its own.
  - id: STRUCTURAL_STABILITY_VALIDITY
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "6.17(h)", page: 73, status: verified}
    anchor: certificate.issue_date
    duration: {value: 60, unit: months, month_end: clamp}
    applies_to: validity_period

  # An obligation an officer records with the due date the undertaking or letter itself states.
  - id: UNDERTAKING_DUE_DATE
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {doc: "the undertaking or letter the officer records", status: verified_letter_text}
    anchor: obligation.recorded_due_date
    due: on_anchor_date
    # demo assumption
    reminders: [-7d, -2d]

  # ---- compliance obligations created from an LoA ----

  # Superseded by DEPOSIT_15D (official, cl. 2.25(f)). No longer opened; kept so clocks opened under it before
  # this change still resolve their rule.
  - id: LOA_DEPOSIT_AFFIDAVIT_15D
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "1.12", status: demo_assumption}
    anchor: letter.issue_date
    duration: {value: 15, unit: calendar_days}

  # APH p.205, Affidavit 3 item 5: the remaining requirements are completed within one month of the approval
  # letter. Opened as an UNDERTAKING with every LoA.
  - id: AFFIDAVIT3_REMAINING_1M
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "Affidavit 3 item 5", page: 205, status: verified}
    anchor: letter.issue_date
    duration: {value: 1, unit: months, month_end: clamp}

  # APH cl. 1.10(b)(i), p.24: affidavit within seven days when no admissions are made after the LoA. Opened when an
  # officer records the obligation (recordable), anchored on the day the officer records it.
  - id: NO_ADMISSION_AFFIDAVIT_7D
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "1.10(b)(i)", page: 24, status: verified}
    anchor: no_admission.recorded
    duration: {value: 7, unit: calendar_days}
    recordable: true

  # APH cl. 1.10(b)(ii), p.25: an LoA is valid for two academic years. Counted as 24 months from the issue date,
  # the calendar reading of two academic years.
  - id: LOA_VALIDITY_2Y
    clock_kind: LEGAL
    clock_owner: INSTITUTION
    source: {clause: "1.10(b)(ii)", page: 25, status: verified}
    anchor: letter.issue_date
    duration: {value: 24, unit: months, month_end: clamp}

# Academic-year boundary used by LEASE_EOA_STOP (ay_start_rule).
# demo_assumption: the APH text read so far does not fix the start day; configurable.
academic_year:
  source: {status: demo_assumption}
  starts: "07-01"

# Alerts and escalation, read by the deadline timer worker (python -m app.deadlines.worker).
# demo_assumption: the APH sets no reminder or escalation schedule. Every offset, role and channel here is a
# configurable placeholder until the team confirms one.
# Offsets are relative to the deadline's due instant (end of the due date, IST). A level is raised when its
# offset passes; the next level is raised when that time passes with no acknowledgement, or at once when the
# addressed role group has no members (explicit vacancy). An acknowledgement stops the ladder for that
# due_version. Rules pick a ladder with alert_ladder (default below, or "none").
alerts:
  source: {status: demo_assumption}
  channels: [in_app, email]
  owner_roles: {AICTE: RO_OFFICER, INSTITUTION: INSTITUTION, COMMITTEE: SCRUTINY_COMMITTEE}
  retry_after_minutes: 15
  default_ladder: standard
  ladders:
    standard:
      - {level: 0, to: owner, at: -2d, template: deadline.reminder}
      - {level: 1, to: RO_OFFICER, at: 0d, template: deadline.breached}
      - {level: 2, to: BUREAU_OFFICER, at: 3d, template: deadline.escalated}
      - {level: 3, to: BUREAU_HEAD, at: 7d, template: deadline.escalated}
    reminder_only:
      - {level: 0, to: owner, at: -2d, template: deadline.reminder}
    # an expired document; DOCUMENT_EXPIRY's own advance reminders go to the institution before these
    document_expiry:
      - {level: 0, to: RO_OFFICER, at: 0d, template: deadline.breached}
      - {level: 1, to: BUREAU_OFFICER, at: 7d, template: deadline.escalated}
      - {level: 2, to: BUREAU_HEAD, at: 30d, template: deadline.escalated}
