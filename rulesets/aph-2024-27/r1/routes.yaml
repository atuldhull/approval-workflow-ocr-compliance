# Default ruleset: base Approval Process Handbook 2024-25 to 2026-27, as read.
# Still a demo configuration until an authorised AICTE reviewer signs it off.
ruleset: aph-2024-27
revision: r1
status: verified_text
source: {doc: "APH 2024-25 to 2026-27", clause: "Table 2.3", page: 30}

roles:
  evc_constituted_by: REGIONAL_OFFICER

# Clocks opened when an application is submitted (rule ids from deadlines.yaml).
clocks:
  on_submit: [AICTE_PROCESSING]

# Table 2.3: SHC is "as applicable" exactly where an EVC is required.
grammar_version: 1
evc:
  rule_id: EVC_PROCESSING
  source_status: DEMO_ASSUMPTION
  assumption_code: EVC_DURATION_UNCONFIRMED
# DEMO ASSUMPTION: not an APH-confirmed geographic eligibility or COI policy.
expert_pool:
  region_rule: SAME_REGION
  slot_parts: [AM, PM]
  coi_reasons: {INSTITUTION_LINK: INSTITUTION_LINK, PRIOR_ENGAGEMENT: PRIOR_ENGAGEMENT, RECUSAL: RECUSAL}
  source_status: DEMO_ASSUMPTION
  assumption_code: EXPERT_POLICY_UNCONFIRMED
  # DEMO ASSUMPTION: capacity counts panels; original due_by stays unchanged for lateness/escalation.
  # expert_daily_cap: visits per expert per date; cpsat_candidate_slots: earliest feasible slots CP-SAT models per request.
  scheduler:
    capacity_unit: PANELS
    allow_late: true
    expert_daily_cap: 1
    cpsat_candidate_slots: 12
    source_status: DEMO_ASSUMPTION
    assumption_code: EDF_PLANNING_UNCONFIRMED
  # SIMULATED authorised selector (stand-in); DEMO ASSUMPTION, not an official panel policy.
  selector:
    version: DEMO_SELECTOR_V1
    panel_size: 3
    required_expertise_tags: [DEMO]
    category_expertise_tags: {}
    minimum_expertise_matches: 1
    source_status: DEMO_ASSUMPTION
    assumption_code: SELECTOR_POLICY_UNCONFIRMED
intake: {checklist_file: checklists.yaml}
# DEMO ASSUMPTION: controlled demonstration requirements and response-window policy.
# Duration is configurable in P2's deadlines.yaml under response_rule_id, not APH-confirmed.
deficiency:
  item_keys: [DEMO_CORE_REFERENCE, DEMO_ADDITIONAL_REFERENCE, DEMO_FACILITY_REFERENCE, DEMO_STAFF_REFERENCE, DEMO_SAFETY_REFERENCE]
  reason_codes: [DEMO_REASON, DEMO_MISSING_EVIDENCE, DEMO_ACCEPTANCE, DEMO_RESPONSE_ACCEPTED, DEMO_RESPONSE_REJECTED]
  response_rule_id: INSTITUTION_RESPONSE
  source_status: DEMO_ASSUMPTION
  assumption_code: DEFICIENCY_RESPONSE_WINDOW_UNCONFIRMED
# DEMO ASSUMPTION GF-006: no APH-confirmed rule says when a revert needs a second approver. Configurable;
# other guard facts are derived from persisted records by app.workflow.facts (GF-001..GF-005).
guard_facts:
  revert_second_approval_required: false
  source_status: DEMO_ASSUMPTION
  assumption_code: GUARD_FACT_POLICY_UNCONFIRMED
workflow_source:
  status: demo_assumption
  label: DEMO ASSUMPTION
  assumption_refs: [TG-001, TG-002, TG-003, TG-004, TG-005, TG-006]
terminal_states:
- APPROVED
- REJECTED
- WITHDRAWN
auxiliary_stages:
  DEFICIENT: SCRUTINY
  RESCRUTINY: SCRUTINY
resume_after:
  RESCRUTINY: SCRUTINY

# DEMO ASSUMPTION TG-001..TG-006: workflow policies below await team/APH confirmation.
# Every applied transition emits wf.transition_applied (contracts/events/wf/transition_applied.v1.json).
templates:
  submit:
    action: submit
    from_stage: DRAFT
    to_stage: $first
    allowed_roles:
    - INSTITUTION
    guards:
    - application_is_draft
    - checklist_complete
    - dsc_required
    reason_codes_required: false
    timers:
    - op: open
      rule_id: AICTE_PROCESSING
      anchor: command.now
    emits_event: wf.application_submitted
    letter: null
  advance:
    action: advance
    from_stage: $route
    to_stage: $next
    allowed_roles:
    - SCRUTINY_COMMITTEE
    - BUREAU_OFFICER
    guards:
    - open_items_zero
    - actor_has_assignment
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    aliases:
    - scrutinise
    - complete
  deficiency:
    action: record_deficiency
    from_stage: [SCRUTINY, RESCRUTINY]
    to_stage: DEFICIENT
    allowed_roles:
    - SCRUTINY_COMMITTEE
    guards:
    - reason_code_present
    - deficiency_items_present
    reason_codes_required: true
    timers:
    - op: pause_internal
      rule_id: AICTE_PROCESSING
      anchor: null
    - op: open
      rule_id: INSTITUTION_RESPONSE
      anchor: command.now
    emits_event: wf.transition_applied
    letter: null
    requires_stages:
    - SCRUTINY
  compliance:
    action: submit_compliance
    from_stage: DEFICIENT
    to_stage: RESCRUTINY
    allowed_roles:
    - INSTITUTION
    guards:
    - response_received
    reason_codes_required: false
    timers:
    - op: close
      rule_id: INSTITUTION_RESPONSE
      anchor: null
      outcome: MET
    - op: resume_internal
      rule_id: AICTE_PROCESSING
      anchor: null
    emits_event: wf.transition_applied
    letter: null
    requires_stages:
    - SCRUTINY
  rescrutiny:
    action: start_rescrutiny
    from_stage: RESCRUTINY
    to_stage: RESCRUTINY
    allowed_roles:
    - SCRUTINY_COMMITTEE
    - BUREAU_OFFICER
    guards:
    - response_received
    - actor_has_assignment
    reason_codes_required: false
    timers: []  # compliance already closed/resumed the clocks; review never repeats them
    emits_event: wf.transition_applied
    letter: null
    requires_stages:
    - SCRUTINY
  to_evc:
    action: advance_to_evc
    from_stage: $route
    to_stage: $next
    allowed_roles:
    - SCRUTINY_COMMITTEE
    - BUREAU_OFFICER
    guards:
    - open_items_zero
    - actor_has_assignment
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    match_to: EVC
    requires_stages:
    - EVC
  evc_complete:
    action: complete_evc
    from_stage: EVC
    to_stage: $next
    allowed_roles:
    - SCRUTINY_COMMITTEE
    - BUREAU_OFFICER
    guards:
    - open_items_zero
    - actor_has_assignment
    - evc_schedule_published
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    requires_stages:
    - EVC
  evc_complete_last:
    action: complete_evc
    from_stage: EVC
    to_stage: EVC
    allowed_roles: [SCRUTINY_COMMITTEE, BUREAU_OFFICER]
    guards: [at_last_applicable_stage, actor_has_assignment, open_items_zero, evc_schedule_published]
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    requires_stages: [EVC]
  to_shc:
    action: advance_to_shc
    from_stage: $route
    to_stage: $next
    allowed_roles:
    - SCRUTINY_COMMITTEE
    - BUREAU_OFFICER
    guards:
    - open_items_zero
    - actor_has_assignment
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    match_to: SHC
    requires_stages:
    - SHC
  loa:
    action: issue_loa
    from_stage: $last
    to_stage: APPROVED
    allowed_roles:
    - BUREAU_OFFICER
    guards:
    - at_last_applicable_stage
    - decision_authorised
    - letter_type_matches_decision
    - open_items_zero
    reason_codes_required: false
    timers:
    - op: close
      rule_id: AICTE_PROCESSING
      anchor: null
      outcome: MET
      if_live: true
    - op: close
      rule_id: INSTITUTION_RESPONSE
      anchor: null
      outcome: WAIVED
      if_live: true
    emits_event: wf.transition_applied
    letter:
      type: LOA
      lists_deficiencies: false
  eoa:
    action: issue_eoa
    from_stage: $last
    to_stage: APPROVED
    allowed_roles:
    - BUREAU_OFFICER
    guards:
    - at_last_applicable_stage
    - decision_authorised
    - letter_type_matches_decision
    - open_items_zero
    reason_codes_required: false
    timers:
    - op: close
      rule_id: AICTE_PROCESSING
      anchor: null
      outcome: MET
      if_live: true
    - op: close
      rule_id: INSTITUTION_RESPONSE
      anchor: null
      outcome: WAIVED
      if_live: true
    emits_event: wf.transition_applied
    letter:
      type: EOA
      lists_deficiencies: false
  # An LoD keeps the case at its decision stage and opens the appeal window (appeal block below); the case is
  # finally rejected only when the window lapses unappealed or the Council rejects the appeal.
  lod:
    action: issue_lod
    from_stage: $last
    to_stage: $current
    allowed_roles:
    - BUREAU_OFFICER
    guards:
    - at_last_applicable_stage
    - decision_authorised
    - letter_type_matches_decision
    - open_items_zero
    reason_codes_required: false
    timers:
    - op: close
      rule_id: AICTE_PROCESSING
      anchor: null
      outcome: MET
      if_live: true
    - op: close
      rule_id: INSTITUTION_RESPONSE
      anchor: null
      outcome: WAIVED
      if_live: true
    - op: open
      rule_id: APPEAL_7D
      anchor: letter.issue_date
    emits_event: wf.transition_applied
    letter:
      type: LOD
      lists_deficiencies: false
  reject:
    action: reject
    from_stage: $active
    to_stage: REJECTED
    allowed_roles:
    - BUREAU_OFFICER
    guards:
    - reason_code_present
    reason_codes_required: true
    timers:
    - op: close
      rule_id: AICTE_PROCESSING
      anchor: null
      outcome: MET
      if_live: true
    - op: close
      rule_id: INSTITUTION_RESPONSE
      anchor: null
      outcome: WAIVED
      if_live: true
    emits_event: wf.transition_applied
    letter: null
  withdraw:
    action: withdraw
    from_stage: $active
    to_stage: WITHDRAWN
    allowed_roles:
    - INSTITUTION
    guards:
    - reason_code_present
    reason_codes_required: true
    timers:
    - op: close
      rule_id: AICTE_PROCESSING
      anchor: null
      outcome: MET
      if_live: true
    - op: close
      rule_id: INSTITUTION_RESPONSE
      anchor: null
      outcome: WAIVED
      if_live: true
    emits_event: wf.transition_applied
    letter: null
  revert:
    action: revert
    from_stage: $active
    to_stage: $previous
    allowed_roles:
    - BUREAU_OFFICER
    guards:
    - reason_code_present
    - previous_stage_visited
    - second_approval_if_required
    reason_codes_required: true
    timers: []
    emits_event: wf.transition_applied
    letter: null
    aliases:
    - authorised_revert

  # ---- appeal against an LoD (APH 2024-27 cl. 1.11, p.25; cl. 2.24, p.45) ----
  # The system records what people decide: the institution files, the SAC recommends and the Council decides.
  appeal_file:
    action: file_appeal
    from_stage: $last
    to_stage: SAC
    allowed_roles: [INSTITUTION]
    guards: [at_last_applicable_stage, appeal_window_open]
    reason_codes_required: false
    timers:
    - {op: close, rule_id: APPEAL_7D, anchor: null, outcome: MET}
    emits_event: wf.transition_applied
    letter: null
  # Driven by the APPEAL_7D clock (deadlines.yaml on_expiry): once it is breached the deadline worker closes the
  # window as SYSTEM; an officer may record the same lapse. The LoD then stands as the final rejection.
  appeal_lapse:
    action: close_appeal_window
    from_stage: $last
    to_stage: REJECTED
    allowed_roles: [SYSTEM, BUREAU_OFFICER]
    guards: [at_last_applicable_stage, appeal_window_lapsed]
    reason_codes_required: false
    timers:
    - {op: close, rule_id: APPEAL_7D, anchor: null, outcome: WAIVED}
    emits_event: wf.transition_applied
    letter: null
  # cl. 1.11(d): the SAC recommends or does not recommend the case to the Council, or recommends a Scrutiny
  # Committee / EVC. A member of the case's SAC committee records it, citing the SAC's latest report.
  sac_recommend:
    action: sac_recommend
    from_stage: SAC
    to_stage: SAC
    allowed_roles: [SCRUTINY_COMMITTEE, BUREAU_OFFICER]
    guards: [appeal_filed, actor_has_assignment, decision_authorised]
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
  sac_not_recommend:
    action: sac_not_recommend
    from_stage: SAC
    to_stage: SAC
    allowed_roles: [SCRUTINY_COMMITTEE, BUREAU_OFFICER]
    guards: [appeal_filed, actor_has_assignment, decision_authorised]
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
  sac_refer_scrutiny:
    action: sac_refer_scrutiny
    from_stage: SAC
    to_stage: SCRUTINY
    allowed_roles: [SCRUTINY_COMMITTEE, BUREAU_OFFICER]
    guards: [appeal_filed, actor_has_assignment, decision_authorised]
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    requires_stages: [SCRUTINY]
  sac_refer_evc:
    action: sac_refer_evc
    from_stage: SAC
    to_stage: EVC
    allowed_roles: [SCRUTINY_COMMITTEE, BUREAU_OFFICER]
    guards: [appeal_filed, actor_has_assignment, decision_authorised]
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    requires_stages: [EVC]
  # cl. 1.11(d): after a referral the new reports are placed before another SAC, not decided again here.
  sac_return:
    action: return_to_sac
    from_stage: $last
    to_stage: SAC
    allowed_roles: [BUREAU_OFFICER]
    guards: [at_last_applicable_stage, appeal_referred_back, open_items_zero]
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
  # cl. 1.11(e) / 2.24(f): the Council's decision on the SAC recommendation is final. BUREAU_HEAD records it.
  sac_loa:
    action: issue_loa
    from_stage: SAC
    to_stage: APPROVED
    allowed_roles: [BUREAU_HEAD]
    guards: [appeal_recommendation_recorded, decision_authorised, letter_type_matches_decision]
    reason_codes_required: false
    timers: &council_closes
    - {op: close, rule_id: AICTE_PROCESSING, anchor: null, outcome: MET, if_live: true}
    - {op: close, rule_id: INSTITUTION_RESPONSE, anchor: null, outcome: WAIVED, if_live: true}
    emits_event: wf.transition_applied
    letter: {type: LOA, lists_deficiencies: false}
  sac_eoa:
    action: issue_eoa
    from_stage: SAC
    to_stage: APPROVED
    allowed_roles: [BUREAU_HEAD]
    guards: [appeal_recommendation_recorded, decision_authorised, letter_type_matches_decision]
    reason_codes_required: false
    timers: *council_closes
    emits_event: wf.transition_applied
    letter: {type: EOA, lists_deficiencies: false}
  # cl. 1.10(b): a Letter of Rejection carries a Speaking Order with the specific reasons; it is the command's
  # note, kept as a protected note (hash in the ledger).
  sac_lor:
    action: issue_lor
    from_stage: SAC
    to_stage: REJECTED
    allowed_roles: [BUREAU_HEAD]
    guards: [appeal_recommendation_recorded, decision_authorised, letter_type_matches_decision, speaking_order_present]
    reason_codes_required: false
    timers: *council_closes
    emits_event: wf.transition_applied
    letter: {type: LOR, lists_deficiencies: false}

transitions: &standard [submit, advance, deficiency, compliance, rescrutiny, to_evc, evc_complete, evc_complete_last, to_shc, loa, eoa, lod, reject, withdraw, revert,
                        appeal_file, appeal_lapse, sac_recommend, sac_not_recommend, sac_refer_scrutiny, sac_refer_evc, sac_return,
                        sac_loa, sac_eoa, sac_lor]

routes:
  EOA_SELF_DISCLOSURE:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 1, page: 46, status: VERIFIED}
    label: Extension of Approval based on self-disclosure
    stages: [SELF_DISCLOSURE]
    transitions: *standard
  NRI_SEATS:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 2, page: 46, status: VERIFIED}
    label: Introduction/continuation of NRI seats
    stages: [SELF_DISCLOSURE]
    transitions: *standard
  CONVERSION_LEVEL:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 3, page: 46, status: VERIFIED}
    label: Conversion diploma to degree level or vice versa
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  CHANGE_OF_NAME:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 4, page: 46, status: VERIFIED}
    label: Change of name of institution / affiliating university / board / type
    stages: [SCRUTINY]
    transitions: *standard
  NEW_PROGRAMME:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 5, page: 46, status: VERIFIED}
    label: New programme / level in existing institution
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  MERGER:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 6, page: 46, status: VERIFIED}
    label: Merger of institutions
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  RESTORATION:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 7, page: 46, status: VERIFIED}
    label: EoA after a break / restoration of intake / hibernation
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  SUPERNUMERARY_SEATS:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 8, page: 46, status: VERIFIED}
    label: Supernumerary seats (foreign nationals / OCI / children of Indian workers in Gulf)
    stages: [SCRUTINY]
    transitions: *standard
  INCREASE_INTAKE:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 9, page: 46, status: VERIFIED}
    label: Increase in intake / additional course(s)
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  INTEGRATED_DUAL:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 10, page: 46, status: VERIFIED}
    label: Integrated / dual degree course
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  FELLOW_PROGRAMME:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 11, page: 46, status: VERIFIED}
    label: Fellow Programme in Management
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  COURSE_CHANGE_REDUCTION:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 12, page: 46, status: VERIFIED}
    label: Change of course name / merger of courses / reduction in intake
    stages: [SCRUTINY]
    transitions: *standard
  COLLABORATION_TWINNING:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 13, page: 46, status: VERIFIED}
    label: Collaboration and twinning programme
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  CHANGE_OF_SITE:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 14, page: 46, status: VERIFIED}
    label: Change of site / location
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  CLOSURE_INSTITUTION:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 15, page: 46, status: VERIFIED}
    label: Closure of the institution
    stages: [SCRUTINY]
    transitions: *standard
  CONVERSION_COED:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 16, page: 46, status: VERIFIED}
    label: Conversion women's to co-ed institution or vice versa
    stages: [SCRUTINY]
    transitions: *standard
  CLOSURE_PROGRAMME:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 17, page: 46, status: VERIFIED}
    label: Closure of programme(s) / course(s)
    stages: [SCRUTINY]
    transitions: *standard
  BANK_DETAILS:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 18, page: 46, status: VERIFIED}
    label: Change in bank details
    stages: [SCRUTINY]
    transitions: *standard
  TRUST_NAME:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 19, page: 46, status: VERIFIED}
    label: Change of name of trust / society / company
    stages: [SCRUTINY]
    transitions: *standard
  DEEMED_UNIVERSITY:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 20, page: 46, status: VERIFIED}
    label: Conversion into a deemed-to-be university
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  ODL:
    clause_citation: {source_document: APH_2024_27, locator: TABLE_2_3, clause: "2.23.4", row: 21, page: 46, status: VERIFIED}
    label: Online Learning / ODL courses
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}]
    transitions: *standard
  # Chapter I route (sections 1.3-1.12), not part of Table 2.3. Scrutiny, EVC, EC and the Council's ratification
  # follow cl. 1.8-1.10 (p.23-24); the optional SHC step is not in Chapter I, so the stage list stays a demo assumption.
  NEW_INSTITUTION:
    clause_citation: {source_document: APH_2024_27, locator: CHAPTER_I, clause: "1.8-1.11", page: 23, status: DEMO_ASSUMPTION, assumption_ref: INTAKE_CITATION_UNCONFIRMED}
    label: Setting up a new institution
    stages: [SCRUTINY, EVC, {stage: SHC, when: as_applicable}, EC, COUNCIL]
    # its own EVC timeline (deadlines.yaml EVC_NEW_INSTITUTION); the APH sets no duration, so it is a demo value
    evc_rule_id: EVC_NEW_INSTITUTION
    transitions: *standard
  # "Only EVC" routes: AICTE-initiated visits to an existing institution, opened by the institution's filing once
  # AICTE has intimated it. SHC follows "as applicable", as everywhere an EVC is held (Table 2.3 pairing).
  RANDOM_INSPECTION:
    clause_citation: {source_document: APH_2024_27, locator: SECTION_2_3_5, clause: "2.3.5(a)", page: 31, status: VERIFIED}
    label: EVC (inspection) of an existing institution selected at random
    stages: [EVC, {stage: SHC, when: as_applicable}]
    initiated_by: AICTE
    transitions: *standard
  # cl. 7.10(c)-(d): on a verified complaint the SCSC may have an EVC conducted, whose report goes before the SHC.
  COMPLAINT_EVC:
    clause_citation: {source_document: APH_2024_27, locator: SECTION_7_10, clause: "7.10(c)-(d)", page: 89, status: VERIFIED}
    label: EVC on a verified complaint
    stages: [EVC, {stage: SHC, when: as_applicable}]
    initiated_by: AICTE
    transitions: *standard

# APH 2024-27 cl. 1.11(a), p.25 / cl. 2.24(a), p.45 (verified): an aggrieved institution may appeal once, within
# 7 days of the LoD, to the Council; the Standing Appellate Committee (SAC) hears it. Read by the workflow grammar
# and engine: the trigger decision opens the window clock, and SAC is open to every route without being part of
# its plan. While the window is open only the appeal actions apply; after a referral back the decision returns to
# the SAC (return_to_sac), never to a second LoD.
appeal:
  trigger: issue_lod
  window: APPEAL_7D
  max_appeals: 1
  stage: SAC
  source: {source_document: APH_2024_27, clause: "1.11(a); 2.24(a)", page: 25, status: VERIFIED}
