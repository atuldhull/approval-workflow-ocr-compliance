[alembic]
script_location = %(here)s/migrations
# One independent migration chain per module, so nobody edits another person's revision files.
# Upgrade with: alembic -c backend/alembic.ini upgrade heads   (plural)
version_locations = %(here)s/migrations/versions/platform %(here)s/migrations/versions/workflow %(here)s/migrations/versions/evc %(here)s/migrations/versions/documents %(here)s/migrations/versions/compliance %(here)s/migrations/versions/deadlines %(here)s/migrations/versions/analytics
version_path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
