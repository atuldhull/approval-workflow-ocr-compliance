grammar_version: 1
terminal_states:
- APPROVED
clocks:
  on_submit: []
auxiliary_stages: {}
resume_after: {}
templates:
  submit:
    allowed_roles:
    - INSTITUTION
    guards: []
    reason_codes_required: false
    timers: []
    emits_event: wf.application_submitted
    letter: null
    action: submit
    from_stage: DRAFT
    to_stage: $first
  finish:
    allowed_roles:
    - BUREAU_OFFICER
    guards:
    - at_last_applicable_stage
    - letter_type_matches_decision
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter:
      type: LOA
      lists_deficiencies: false
    action: issue_loa
    from_stage: $last
    to_stage: APPROVED
  back:
    allowed_roles:
    - BUREAU_OFFICER
    guards: []
    reason_codes_required: false
    timers: []
    emits_event: wf.transition_applied
    letter: null
    action: revert
    from_stage: $active
    to_stage: $previous
transitions:
- submit
- finish
routes:
  X:
    label: DEMO
    stages:
    - SCRUTINY
    transitions:
    - submit
    - finish
