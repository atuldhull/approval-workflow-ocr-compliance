# Lightweight default: database + backend + frontend (demo sign-in, local policy engine).
#   docker compose up --build
#
# Optional profiles - laptops only run them when needed:
#   docker compose --profile worker up            # + notification delivery and deadline timer workers
#   docker compose --env-file .env.security --profile security --profile worker up
#                                                 # + Keycloak, Cerbos, Mailpit (local mail sink), real sign-in
#   docker compose --profile scanning up -d clamav  # + ClamAV malware scanner for uploaded documents
#   docker compose --profile web up --build web     # + the production frontend image (nginx) on 8088
# Everything optional binds to 127.0.0.1 only. All accounts and passwords in infra/ are LOCAL DEMO ONLY.
# Without the scanning profile, uploads are accepted but stay scan_pending (unusable) until ClamAV answers.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-awoc}:${POSTGRES_PASSWORD:-awoc}@db:5432/${POSTGRES_DB:-awoc}
  APP_ENV: ${APP_ENV:-development}
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_AUTH: ${DEMO_AUTH:-true}
  AUTHZ_ENGINE: ${AUTHZ_ENGINE:-local}
  CERBOS_URL: ${CERBOS_URL:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-25}
  NOTIFY_RECIPIENT_KEY: ${NOTIFY_RECIPIENT_KEY:-}
  AUDIT_SIGNING_KEY_FILE: ${AUDIT_SIGNING_KEY_FILE:-}
  AUDIT_SIGNING_KEY_ID: ${AUDIT_SIGNING_KEY_ID:-}
  AUDIT_TRUSTED_KEYS_FILE: ${AUDIT_TRUSTED_KEYS_FILE:-}
  AUDIT_WITNESS_DIR: ${AUDIT_WITNESS_DIR:-}
  # uploaded files: a private volume outside the source tree (the storage refuses any path inside the repo)
  DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-/var/lib/awoc/documents}
  CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  DOCUMENT_TEXT_ENGINE: ${DOCUMENT_TEXT_ENGINE:-local}
  # the documents module has no built-in page or pixel limits; these are demo values (an A4 scan at 300 dpi is ~9 MP)
  DOCUMENT_MAX_PDF_PAGES: ${DOCUMENT_MAX_PDF_PAGES:-20}
  DOCUMENT_MAX_IMAGE_PIXELS: ${DOCUMENT_MAX_IMAGE_PIXELS:-25000000}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-awoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-awoc}
      POSTGRES_DB: ${POSTGRES_DB:-awoc}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awoc}"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"   # demo sign-in: never expose beyond this machine
    volumes:
      - ./backend:/srv/backend
      - ./contracts:/srv/contracts
      - ./rulesets:/srv/rulesets
      - ./generator:/srv/generator
      - ./.secrets:/srv/.secrets:ro
      - documents:/var/lib/awoc/documents
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /srv/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"   # Vite dev server: local use only
    volumes:
      - ./frontend:/srv/frontend
      - frontend_modules:/srv/frontend/node_modules
    depends_on:
      - backend

  notifier:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.platform.notifier"]
    environment: *backend-env
    volumes:
      - ./backend:/srv/backend
      - ./contracts:/srv/contracts
    depends_on:
      db:
        condition: service_healthy

  # Deadline timers: fires due alert levels from dl.deadline.next_fire_at. Demo time travel is shared through
  # the database (dl.sim_clock), so this worker sees POST /api/sim/clock too.
  deadline-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.deadlines.worker", "--poll-seconds", "10"]
    environment: *backend-env
    volumes:
      - ./backend:/srv/backend
      - ./contracts:/srv/contracts
      - ./rulesets:/srv/rulesets
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    profiles: ["security"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-demo-only-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  cerbos:
    profiles: ["security"]
    image: ghcr.io/cerbos/cerbos:0.40.0
    command: ["server", "--config=/config/config.yaml"]
    ports:
      - "127.0.0.1:${CERBOS_PORT:-3592}:3592"
    volumes:
      - ./infra/cerbos/config.yaml:/config/config.yaml:ro
      - ./infra/cerbos/policies:/policies:ro

  mailpit:
    profiles: ["security"]
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"   # web UI showing every captured message; nothing leaves the machine
      - "127.0.0.1:1025:1025"   # SMTP, for a notifier running outside Docker

  # Malware scanning for uploads (clamd on 3310, INSTREAM protocol). Signatures download on first start and are
  # refreshed by freshclam inside the container; the volume keeps them across restarts. The first start takes a
  # few minutes before the health check passes.
  clamav:
    profiles: ["scanning"]
    image: clamav/clamav:1.4.6
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  # The built UI as it would be deployed: static files and an /api proxy behind nginx, with the UI's own CSP.
  web:
    profiles: ["web"]
    build:
      context: frontend
    environment:
      API_UPSTREAM: http://backend:8000
      OIDC_ORIGIN: http://localhost:${KEYCLOAK_PORT:-8081}
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_modules:
  clamav_db:
  documents:
